[package]
name = "z-auth-postgres"
version = "0.3.0"
edition = "2024"
description = "Reference PostgreSQL adapter for z-auth (sqlx)"

[features]
default = []
# z-auth-cluster shared mode: the node registry and the cluster tables.
shared = ["dep:z-auth-cluster", "z-auth-cluster/shared"]
# z-auth-cluster federation mode: the sync store and the session-store schema.
federation = ["shared", "z-auth-cluster/federation"]
# z-auth-mfa: the second-factor store and its migration set.
mfa = ["dep:z-auth-mfa"]

[[bin]]
name = "setup_db"
path = "src/bin/setup_db.rs"

[dependencies]
z-auth    = { path = "../.." }
z-auth-cluster = { path = "../cluster", default-features = false, optional = true }
z-auth-mfa  = { path = "../mfa", default-features = false, optional = true }
async-trait = "0.1.89"
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "ipnet", "migrate", "json"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio       = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The built-in sealer for the end-to-end mfa tests.
z-auth-mfa = { path = "../mfa" }

[[test]]
name = "node_registry"
required-features = ["shared"]

[[test]]
name = "sync"
required-features = ["federation"]

[[test]]
name = "federation"
required-features = ["federation"]

[[test]]
name = "mfa"
required-features = ["mfa"]
