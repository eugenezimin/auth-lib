[package]
name = "auth-lib-postgres"
version = "0.2.0"
edition = "2024"
description = "Reference PostgreSQL adapter for auth-lib (sqlx)"

[[bin]]
name = "setup_db"
path = "src/bin/setup_db.rs"

[dependencies]
auth-lib    = { path = "../.." }
async-trait = "0.1.89"
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "ipnet", "migrate"] }
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio       = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
