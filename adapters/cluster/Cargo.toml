[package]
name = "z-auth-cluster"
version = "0.2.0"
edition = "2024"
description = "Optional clustering for z-auth: shared mode and federation mode"

[features]
default = ["federation"]
# Push-based sync between z-auth instances over one database (membership,
# revocations, keys, catalog changes) over a host-provided transport.
shared = []
# Database per service: the authority owns identity, every other service
# keeps a session store, and session state is synced between them.
federation = ["shared"]

[dependencies]
z-auth     = { path = "../..", default-features = false, features = ["crypto", "serde"] }
async-trait  = "0.1.89"
uuid         = { version = "1", features = ["v4", "v5", "serde"] }
chrono       = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
getrandom    = "0.4"
base64       = "0.23"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hmac         = "0.13"
sha2         = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
z-auth         = { path = "../..", features = ["argon2", "crypto", "serde"] }
z-auth-testkit = { path = "../../testkit", features = ["federation"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json       = "1"
