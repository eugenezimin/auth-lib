[package]
name = "z-auth-testkit"
version = "0.2.0"
edition = "2024"
description = "In-memory adapters and helpers for z-auth's test suites"
publish = false

[features]
default = []
# In-memory cluster ports (node registry, federation sync store).
shared = ["dep:z-auth-cluster", "z-auth-cluster/shared"]
federation = ["shared", "z-auth-cluster/federation"]

[dependencies]
z-auth         = { path = "..", features = ["argon2", "crypto", "serde"] }
z-auth-cluster = { path = "../adapters/cluster", default-features = false, optional = true }
async-trait      = "0.1.89"
chrono           = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid             = { version = "1", features = ["v4"] }
