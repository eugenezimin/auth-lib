[package]
name = "z-auth"
version = "0.3.0"
edition = "2024"

[workspace]
members = ["adapters/postgres", "adapters/cluster", "adapters/mfa", "testkit"]

[features]
default = ["argon2", "crypto", "serde"]
# Built-in Argon2id implementation of `credentials::PasswordHasher`.
argon2 = ["dep:argon2"]
# Built-in token cryptography: Ed25519 JWT access tokens + HMAC refresh tokens.
crypto = ["dep:ed25519-dalek", "dep:hmac", "dep:sha2", "dep:serde", "dep:serde_json"]
# Serialize / Deserialize derives on models and API DTOs.
serde = ["dep:serde", "uuid/serde", "chrono/serde"]

[dependencies]
async-trait = "0.1.89"
uuid        = { version = "1", features = ["v4", "v5"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom   = "0.4"
base64      = "0.23"
argon2      = { version = "0.5", features = ["std"], optional = true }
serde       = { version = "1", features = ["derive"], optional = true }
serde_json  = { version = "1", optional = true }
ed25519-dalek = { version = "3", optional = true }
hmac        = { version = "0.13", optional = true }
sha2        = { version = "0.11", optional = true }

[dev-dependencies]
z-auth-testkit = { path = "testkit" }
tokio            = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json       = "1"

[[example]]
name = "keygen"
required-features = ["crypto"]
